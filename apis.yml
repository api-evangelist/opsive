apis:
- name: Opsive State Designer Scripting API
  description: In-engine C# scripting API for Opsive's State Designer Unity asset. The StateMachine component is the main code entry point for
    a State Designer graph, used by other scripts to control execution, inspect runtime state, respond to lifecycle changes, access Shared Variables,
    or save and restore the graph. This is a Unity library API, not a network web API; no HTTP base URL or machine-readable contract is published.
