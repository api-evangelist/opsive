aid: opsive

name: Opsive

description: Opsive is a Unity game-development tools company that builds and sells editor assets for the Unity engine, including Behavior Designer
  Pro (behavior trees and AI), the Ultimate Character Controller, Third Person Controller and UFPS character controllers, the Ultimate Inventory
  System and State Designer, plus add-on packs (movement, senses, tactical, formations, agility, climbing, swimming, multiplayer). Products are
  sold through opsive.com and the Unity Asset Store, with per-product documentation, a forum and Discord community. Opsive does not publish a
  public web API.

